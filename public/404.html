<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AG TechLabs</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects non-hash GitHub Pages URLs to HashRouter routes
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        // Find repo name if served under subpath
        var segments = path.split('/').filter(Boolean);
        var repoName = segments.length > 0 ? '/' + segments[0] : '';
        var subRoute = segments.slice(1).join('/');
        
        var targetUrl = repoName + '/#' + (subRoute ? '/' + subRoute : '/') + search + hash;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="background-color: #030508; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to AG TechLabs...</p>
  </body>
</html>
